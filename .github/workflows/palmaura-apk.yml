name: Build PalmAura APK

# APK بنا کر سائٹ کے ساتھ ہی PalmAura.apk کے نام سے رکھتا ہے،
# تاکہ ڈاؤن لوڈ سیدھا getpalmaura.com سے ہو۔ Vercel اس ریپو کے main پر
# ہر push کے بعد خودکار دوبارہ deploy کر دیتا ہے، اس لیے الگ سے
# کسی "rebuild" مرحلے کی ضرورت نہیں۔
on:
  push:
    branches: [main]
    paths:
      - 'android-palmaura/**'
      - '.github/workflows/palmaura-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: palmaura-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PALMAURA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/palmaura-release.jks"
            echo "PALMAURA_KEYSTORE_PATH=$RUNNER_TEMP/palmaura-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::PALMAURA_KEYSTORE_BASE64 secret not set; signing with a debug key"
          fi

      - name: Build release APK
        working-directory: android-palmaura
        env:
          VERSION_CODE: ${{ github.run_number }}0
          PALMAURA_KEYSTORE_PASSWORD: ${{ secrets.PALMAURA_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../PalmAura.apk

      - name: Commit APK to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PalmAura.apk
          git commit -m "Update PalmAura.apk (build ${{ github.run_number }})"
          git pull --rebase origin main
          git push origin HEAD:main
